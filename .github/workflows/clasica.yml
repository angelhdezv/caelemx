name: Clásica · datos y vista responsive

on:
  push:
    branches: [v0.3.0, main]
    paths:
      - 'assets/wedding/clasica/**'
      - 'assets/fonts/clasica/**'
      - 'catalogo/boda/**'
      - 'css/clasica.css'
      - 'css/catalog.css'
      - 'js/wedding/**'
      - 'data/invitations/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/clasica.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clasica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - name: Capturas para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clasica-visual-qa
          path: test-results/
          retention-days: 14
